name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and quality dependencies
        run: make install PYTHON=python

      - name: Run lint, format, and type checks
        run: make quality

      - name: Run tests and enforce branch coverage
        run: make test

      - name: Check patch whitespace
        run: make committed-diff-check
