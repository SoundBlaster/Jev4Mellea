name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    name: compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and quality dependencies
        run: make install PYTHON=python

      - name: Run lint, format, and type checks
        run: make quality

      - name: Run tests and enforce branch coverage
        run: make test

      - name: Check patch whitespace
        run: make committed-diff-check

  tests:
    name: tests
    if: always()
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Confirm compatibility matrix passed
        if: ${{ needs.compatibility.result != 'success' }}
        run: exit 1
      - name: Confirm required compatibility matrix passed
        if: ${{ needs.compatibility.result == 'success' }}
        run: echo "All supported Python versions passed."
