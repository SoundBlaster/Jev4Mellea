name: Release package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-release:
    name: verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag is on main and matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as project_file:
              package_version = tomllib.load(project_file)["project"]["version"]

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag_version != package_version:
              raise SystemExit(
                  f"Tag version {tag_version!r} does not match pyproject.toml "
                  f"version {package_version!r}."
              )
          PY

  compatibility:
    name: compatibility matrix
    needs: verify-release
    uses: ./.github/workflows/ci.yml

  build:
    name: build distributions
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Save built distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mellea-jev-adapter/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
