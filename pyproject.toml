[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mellea-jev-adapter"
version = "0.1.0"
description = "Unofficial TypeSafe Jev Noul verifier and Choice classifier for Mellea"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "httpx2>=2.0.0,<3",
    "pydantic>=2.12.0,<3",
    "typesafe-sdk>=0.7.0,<0.8.0",
]

[project.optional-dependencies]
mellea = ["mellea==0.7.0"]
dev = ["pytest>=8.3,<10"]
laya = ["laya-mlx>=0.1.0,<0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mellea_jev = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: requires the real Mellea distribution, but no model server",
    "live: explicit opt-in; sends potentially billable requests to TypeSafe",
]
